name: Latest Version - Workflow Dispatch

on:
  workflow_dispatch:
    inputs:
      os-and-arch:
        description: 'Operating System And Architecture'
        required: true
        default: '6.0.0'
        type: choice
        options:
          - Windows (x86_64)
          - Linux (x86_64)
      patch-server-port:
        description: 'Patch server port (useful for resolving port conflicts)"'
        required: true
        default: '5678'
      patch-user-email:
        description: 'Fake registered email (for fake FE account)'
        required: true
        default: 'long@telerik.com'
      patch-user-firstName:
        description: 'Fake registered first name (for fake FE account)'
        required: true
        default: 'Long'
      patch-user-lastName:
        description: 'Fake registered last name (for fake FE account)'
        required: true
        default: 'Wang'
      patch-user-country-code:
        description: 'Fake registered country code (for fake FE account) ; Ex: 86'
        required: true
        default: '86'
      patch-user-provider:
        description: 'Fake registered provider (for fake FE account) ; Ex: Google'
        required: true
        default: 'Google'
      patch-language:
        description: 'Enable Chinese UI'
        required: true
        type: choice
        default: 'No'
        options:
          - 'No'
          - 'Yes (Ctrl+T to toggle)'

defaults:
  run:
    shell: pwsh
    
env:
  OS_ARCH: ${{ github.event.inputs.os-and-arch }}
  PATCH_SERVER_PORT: ${{ github.event.inputs.patch-server-port }}
  PATCH_USER_EMAIL: ${{ github.event.inputs.patch-user-email }}
  PATCH_USER_FNAME: ${{ github.event.inputs.patch-user-firstName }}
  PATCH_USER_LNAME: ${{ github.event.inputs.patch-user-lastName }}
  PATCH_USER_COUNTRYCODE: ${{ github.event.inputs.patch-user-country-code }}
  PATCH_USER_PROVIDER: ${{ github.event.inputs.patch-user-provider }}
  PATCH_LANGUAGE: ${{ github.event.inputs.patch-language }}

jobs:
  init_os_arch:
    runs-on: ubuntu-latest
    outputs:
      library_extension:  ${{ steps.set_library_extension.outputs.library_extension }}
      arch_code:  ${{ steps.set_arch.outputs.arch_code }}

    steps:
      - name: Set Library Extension (dll / so / dylib)
        id: set_library_extension
        run: |
          $extension = 'not-selected'
    
          if ($env:OS_ARCH -eq 'Windows (x86_64)') {
            $extension = 'dll'
          } elseif ($env:OS_ARCH -eq 'Linux (x86_64)') {
            $extension = 'so'
          } elseif ($env:OS_ARCH -eq 'Mac (arm64)' -or $env:OS_ARCH -eq 'Mac (arm64e)' -or $env:OS_ARCH -eq 'Mac (x86_64)') {
            $extension = 'dylib'
          } else {
            throw "Unsupported OS architecture: $env:OS_ARCH"
          }
          
          "library_extension=$extension" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

      - name: Set Library Extension (dll / so / dylib)
        id: set_arch
        run: |
          $arch = 'not-selected'
    
          if ($env:OS_ARCH -eq 'Windows (x86_64)') {
            $arch = 'win32-x86_64'
          } elseif ($env:OS_ARCH -eq 'Linux (x86_64)') {
            $arch = 'linux-x86_64'
          } elseif ($env:OS_ARCH -eq 'Mac (arm64)') {
            $arch = 'mac-arm64'
          } elseif ($env:OS_ARCH -eq 'Mac (arm64e)') {
            $arch = 'mac-arm64e'
          } elseif ($env:OS_ARCH -eq 'Mac (x86_64)') {
            $arch = 'mac-x86_64'
          } else {
            throw "Unsupported OS architecture: $env:OS_ARCH"
          }
          
          "arch_code=$arch" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

  scrape_fe_version:
    runs-on: ubuntu-latest
    
    outputs:
      scraped_version: ${{ steps.get_version.outputs.scraped_version }}

    steps:
      - uses: actions/checkout@v6

      - name: Run the Powershell script
        id: get_version
        working-directory: utils/fe-version-scraper
        run: ./GetLatest-FEVersion.ps1
   
  download-Yui-patch:
    runs-on: ubuntu-latest
    needs: 
      - scrape_fe_version
      - init_os_arch

    env: 
      SCRAPED_VERSION: ${{ needs.scrape_fe_version.outputs.scraped_version }}
      LIBRARY_EXTENSION: ${{ needs.init_os_arch.outputs.library_extension }}
      ARCH_CODE: ${{ needs.init_os_arch.outputs.arch_code }}
      
    outputs:
      is-compatible-cont: ${{ steps.is-compatible-cont.outputs.is-compatible-cont }}
      Yui-fiddler-name: ${{ steps.Yui-fiddler-name.outputs.Yui-fiddler-name }}

    steps:
      - name: Compare SCRAPED_VERSION with 5.17.0
        id: scraped_version_check
        run: |
          $scrapedVersion = $env:SCRAPED_VERSION
          $compareVersion = "5.17.0"
   
          if (-not [string]::IsNullOrEmpty($scrapedVersion)) {
              if ([version]$scrapedVersion -ge [version]$compareVersion) {
                  echo "IS_COMPATIBLE_CONT=true" | Out-File -Append -FilePath $env:GITHUB_ENV
              } else {
                  echo "IS_COMPATIBLE_CONT=false" | Out-File -Append -FilePath $env:GITHUB_ENV
              }
          } else {
              echo "IS_COMPATIBLE_CONT=false" | Out-File -Append -FilePath $env:GITHUB_ENV
          }

      - name: Set IS_COMPATIBLE_CONT as Output
        id: is-compatible-cont
        run: echo "is-compatible-cont=${{ env.IS_COMPATIBLE_CONT }}" >> $env:GITHUB_OUTPUT

      - name: Set Yui name 
        run: echo "YUI_NAME=yui" >> $env:GITHUB_ENV        
      
      - name: Set Yui fiddler name (>= 5.17.0)
        if: env.IS_COMPATIBLE_CONT == 'true'
        run: |
          echo "Yui_FIDDLER_NAME=fiddler.$env:LIBRARY_EXTENSION" >> $env:GITHUB_ENV
          echo "Yui_FIDDLER_NAME_NO_EXTENSION=fiddler" >> $env:GITHUB_ENV

      - name: Set Yui fiddler name (< 5.17.0 or on linux)
        if: env.IS_COMPATIBLE_CONT == 'false' || env.OS_ARCH == 'Linux (x86_64)'
        run: |
          echo "Yui_FIDDLER_NAME=libfiddler.$env:LIBRARY_EXTENSION" >> $env:GITHUB_ENV
          echo "Yui_FIDDLER_NAME_NO_EXTENSION=libfiddler" >> $env:GITHUB_ENV
      
      - name: Set Yui_FIDDLER_NAME as Output
        id: Yui-fiddler-name
        run: echo "Yui-fiddler-name=${{ env.Yui_FIDDLER_NAME }}" >> $env:GITHUB_OUTPUT

      - name: Create Yui directory
        run: |
          if (-Not (Test-Path "Yui")) {
            New-Item -ItemType Directory -Path "Yui"
          }

      - name: Set Yui Release
        if: env.IS_COMPATIBLE_CONT == 'true' 
        run: echo "Yui_RELEASE=continuous" >> $env:GITHUB_ENV
        
      - name: Download Yui Patch
        run: |
          Write-Host "EXTENSION = $env:LIBRARY_EXTENSION"
          Write-Host "ARCH CODE =  $env:ARCH_CODE"
          try {
            # Build the download URLs
            $YuiFiddlerUrl = "https://github.com/project-yui/Yui-patch/releases/download/$env:Yui_RELEASE/$env:YUI_NAME-$env:Yui_FIDDLER_NAME_NO_EXTENSION-$env:ARCH_CODE-$env:Yui_RELEASE.$env:LIBRARY_EXTENSION"
            
            # Print the URLs to ensure they're correct
            Write-Host "Downloading files from $env:Yui_RELEASE"
            Write-Host "Yui Fiddler URL: $YuiFiddlerUrl"

            # Download the files
            Invoke-WebRequest -Uri $YuiFiddlerUrl -OutFile "Yui\$env:Yui_FIDDLER_NAME"
          }
          catch {
            Write-Error "Failed to download the patch files. Error details: $_"
            exit 1
          }
      
      - name: Upload Yui folder as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: Yui-patch
          path: Yui/
          if-no-files-found: error

  download-msojocs-server:
    runs-on: ubuntu-latest
    needs: scrape_fe_version

    env:
      TARGET_VERSION: ${{ needs.scrape_fe_version.outputs.scraped_version }}

    steps:
      - name: Set up Git
        run: |
          git init
          git remote add origin https://github.com/msojocs/fiddler-everywhere-enhance.git
          git config core.sparseCheckout true

      - name: Configure sparse-checkout to download the server directory
        run: |
          Set-Content -Path ".git/info/sparse-checkout" -Value "server"

          # Upstream keeps the legacy implementation on 'main' and the FE 8.x
          # implementation on 'v8.x' (the v8.x preload handling differs: it no
          # longer replaces the installed Electron preload, so window.ipc keeps
          # working under contextIsolation).
          $branch = 'main'
          if (-not [string]::IsNullOrEmpty($env:TARGET_VERSION) -and
              [version]$env:TARGET_VERSION -ge [version]'8.0.0') {
            $branch = 'v8.x'
          }
          Write-Host "Downloading msojocs server from branch: $branch"
          git pull origin $branch

      - name: Move the downloaded directory to the target folder
        run: |
          New-Item -ItemType Directory -Path "msojocs" -Force
          Move-Item -Path "server" -Destination "msojocs/"

      - name: List files in the msojocs/server directory
        run: Get-ChildItem -Path msojocs\server

      - name: Upload msojocs folder as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: msojocs-patch
          path: msojocs/
          if-no-files-found: error

  download-fiddler-everywhere-windows:
    if: ${{ github.event.inputs.os-and-arch == 'Windows (x86_64)' }}
    runs-on: ubuntu-latest
    needs: 
      - scrape_fe_version

    steps:
      - name: Build URL & Download
        run: |
          # Retrieve the scraped version from the previous step
          $scrapedVersion = "${{ needs.scrape_fe_version.outputs.scraped_version }}"
          
          # Check if the scraped version is available
          if (-not [string]::IsNullOrEmpty($scrapedVersion)) {
            $downloadUrl = "https://downloads.getfiddler.com/win/Fiddler%20Everywhere%20$scrapedVersion.exe"
          
            Write-Host "Download URL: $downloadUrl"

            Invoke-WebRequest -Uri $downloadUrl -OutFile "FiddlerEverywhereSetup.exe"
            
          } else {
            Write-Host "SCRAPED_VERSION is empty or not set"
            exit 1
          }

      - name: Extract exe 
        run: 7z x "FiddlerEverywhereSetup.exe" -ofe_extracted

      - name: Extract app
        run: 7z x "fe_extracted/`$PLUGINSDIR/app-64.7z" -ofe_app
        
      - name: Upload Fiddler Everywhere Extracted folder as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: fe_app
          path: fe_app/
          if-no-files-found: error

  download-fiddler-everywhere-linux:
    if: ${{ github.event.inputs.os-and-arch == 'Linux (x86_64)' }}
    runs-on: ubuntu-latest
    needs: 
      - scrape_fe_version

    steps:
      - name: Build URL & Download
        run: |
          # Retrieve the scraped version from the previous step
          $scrapedVersion = "${{ needs.scrape_fe_version.outputs.scraped_version }}"
          
          # Check if the scraped version is available
          if (-not [string]::IsNullOrEmpty($scrapedVersion)) {
            $downloadUrl = "https://downloads.getfiddler.com/linux/fiddler-everywhere-$scrapedVersion.AppImage"
          
            Write-Host "Download URL: $downloadUrl"

            Invoke-WebRequest -Uri $downloadUrl -OutFile "FiddlerEverywhereSetup.AppImage"
            
          } else {
            Write-Host "SCRAPED_VERSION is empty or not set"
            exit 1
          }

      - name: Extract AppImage 
        run: |
          chmod +x ./FiddlerEverywhereSetup.AppImage
          ./FiddlerEverywhereSetup.AppImage --appimage-extract

      - name: Rename squashfs-root to fe_app
        run: mv squashfs-root fe_app
        
      - name: Upload Fiddler Everywhere Extracted folder as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: fe_app
          path: fe_app/
          if-no-files-found: error

  download-fiddler-everywhere-mac:
    if: ${{ github.event.inputs.os-and-arch == 'Mac (x86_64)' || github.event.inputs.os-and-arch == 'Mac (arm64)' || github.event.inputs.os-and-arch == 'Mac (arm64e)' }}
    runs-on: mac-latest
    needs: 
      - scrape_fe_version

    env: 
      ARCH_CODE: ${{ github.event.inputs.arch_code }}

    steps:
      - name: Build URL & Download
        run: |
          # Retrieve the scraped version from the previous step
          $scrapedVersion = "${{ needs.scrape_fe_version.outputs.scraped_version }}"
          
          # Check if the scraped version is available
          if (-not [string]::IsNullOrEmpty($scrapedVersion)) {
            $downloadUrl = "null"

            if ($env:ARCH_CODE -eq "x86_64") {
              $downloadUrl = "https://downloads.getfiddler.com/mac/Fiddler%20Everywhere%20$scrapedVersion.dmg"
            } elseif ($env:ARCH_CODE -eq "arm64") {
              $downloadUrl = "https://downloads.getfiddler.com/mac-arm64/Fiddler%20Everywhere%20$scrapedVersion.dmg"
            } elseif ($env:ARCH_CODE -eq "arm64e") {
              //Don't know
            } else {
              throw "Unsupported OS architecture: $env:ARCH_CODE"
            }
          
            Write-Host "Download URL: $downloadUrl"

            Invoke-WebRequest -Uri $downloadUrl -OutFile "FiddlerEverywhereSetup.dmg"
            
          } else {
            Write-Host "SCRAPED_VERSION is empty or not set"
            exit 1
          }

      - name: Extract Dmg 
        run: |
          hdiutil attach FiddlerEverywhere.dmg
          cp -R /Volumes/FiddlerEverywhere/* ./fe_app/

      - name: List fe_app
        run: Get-ChildItem -Recurse
        
      - name: Upload Fiddler Everywhere Extracted folder as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: fe_app
          path: fe_app/
          if-no-files-found: error

  patch_fe:
    runs-on: windows-latest

    needs:
      - download-Yui-patch
      - download-msojocs-server
      - scrape_fe_version
      - download-fiddler-everywhere-windows
      - download-fiddler-everywhere-linux
      - download-fiddler-everywhere-mac
    if: always()

    env:
      SCRAPED_VERSION: ${{ needs.scrape_fe_version.outputs.scraped_version }}

    outputs:
      patched-fe-name: ${{ steps.rename-fe.outputs.patched-fe-name }}
      
    steps:
      - name: Checkout repository scripts
        uses: actions/checkout@v6

      - name: Download Yukuhana-Patch
        uses: actions/download-artifact@v8
        with:
          name: Yui-patch
          path: Yui-patch

      - name: Download msojocs-Server
        uses: actions/download-artifact@v8
        with:
          name: msojocs-patch
          path: msojocs-patch

      - name: Download FE
        uses: actions/download-artifact@v8
        with:
          name: fe_app
          path: fe_app

      - name: List the contents of the downloaded artifacts
        run: |
          Get-ChildItem -Recurse Yui-patch
          Get-ChildItem -Recurse msojocs-patch
          Get-ChildItem -Recurse fe_app

      - name: Rename main FE folder
        run: Rename-Item -Path "fe_app" -NewName "FE"

      - name: Patch fiddler.dll / libfiddler.dll
        run: |
          $original_fiddler = "FE/${{ needs.download-Yui-patch.outputs.Yui-fiddler-name }}"
          $Yui_fiddler = "Yui-patch/${{ needs.download-Yui-patch.outputs.Yui-fiddler-name }}"
          
          if ((Test-Path $original_fiddler) -and (Test-Path $Yui_fiddler)) {
            Copy-Item -Path $Yui_fiddler -Destination $original_fiddler -Force
            Write-Host "Replaced $original_fiddler with $Yui_fiddler"
          } else {
            Write-Host "fiddler / libfiddler or Yui patch not found"
          }

      - name: Clean Yui-patch
        run: |
          if (Test-Path Yui-patch) {
            Remove-Item -Path "Yui-patch" -Recurse
          } else {
            Write-Host "Yui-patch Folder not found"
          }

      # FE 8.x ships the app as resources/app.asar instead of resources/app.
      # It has to be extracted (and the archive removed) before main.js and the
      # fake API file tree can be patched.
      - name: Prepare Electron app directory
        run: |
          $resources = "FE/resources"
          $appAsar = Join-Path $resources "app.asar"
          $appDir = Join-Path $resources "app"
          $unpackedDir = Join-Path $resources "app.asar.unpacked"

          if (Test-Path $appAsar) {
            # The asar header lists NOTICES-reporter.txt as unpacked, but some
            # installers do not ship it. @electron/asar fails with ENOENT while
            # extracting unless the placeholder exists.
            if (Test-Path $unpackedDir) {
              $notices = Join-Path $unpackedDir "NOTICES-reporter.txt"
              if (-not (Test-Path $notices)) {
                New-Item -ItemType File -Path $notices -Force | Out-Null
                Write-Host "Created missing $notices"
              }
            }

            Write-Host "resources/app.asar found; extracting to resources/app (FE 8.x layout)"
            if (Test-Path $appDir) {
              Remove-Item -Path $appDir -Recurse -Force
            }
            npx --yes @electron/asar extract $appAsar $appDir
            if (-not (Test-Path (Join-Path $appDir "out/main.js"))) {
              throw "app.asar extraction failed: resources/app/out/main.js not found"
            }
            # Electron prefers app.asar over app/, so remove the archive to make
            # the extracted (and patched) resources/app take effect.
            Remove-Item -Path $appAsar -Force
            Write-Host "app.asar extracted and removed"
          } elseif (Test-Path (Join-Path $appDir "out/main.js")) {
            Write-Host "resources/app already exists (FE < 8.x layout); skipping extraction"
          } else {
            throw "Neither resources/app.asar nor resources/app/out/main.js was found"
          }

          $preloadPath = Join-Path $appDir "out/services/lib/preload.js"
          if (Test-Path $preloadPath) {
            Write-Host "Electron preload found: $preloadPath"
          } else {
            Write-Host "WARNING: Electron preload not found at $preloadPath"
          }

      - name: Copy Server Folder
        run: |
          $source_server_folder = "msojocs-patch/server/file"
          $destination_server_folder = "FE/resources/app/out"
          $target_server_folder = Join-Path $destination_server_folder "file"

          if (-not (Test-Path $source_server_folder)) {
            throw "Source server folder not found: $source_server_folder"
          }
          if (-not (Test-Path $destination_server_folder)) {
            throw "FE app directory not found: $destination_server_folder"
          }

          # Remove first: Copy-Item would otherwise nest file/ inside file/.
          if (Test-Path $target_server_folder) {
            Remove-Item -LiteralPath $target_server_folder -Recurse -Force
          }
          Copy-Item -Path $source_server_folder -Destination $destination_server_folder -Recurse
          Write-Host "Copied $source_server_folder to $target_server_folder"

      - name: Enable Chinese translation
        if: startsWith(env.PATCH_LANGUAGE, 'Yes')
        run: |
          $translate_js = "msojocs-patch/server/translate.js"
          $dest_translate = "FE/resources/app/out/translate.js"

          if (-not (Test-Path $translate_js)) {
            throw "translate.js not found: $translate_js"
          }

          # server/index.js loads ./translate.js relative to the app root. The
          # v8.x implementation injects it into an isolated world, while the
          # legacy one uses it as the preload; both expect a plain copy here.
          Copy-Item -Path $translate_js -Destination $dest_translate -Force
          Write-Host "translate.js copied, Chinese language enabled (Ctrl+T to switch)"

      - name: Set patch server port (in main.js of server)
        run: |
          $source_index = "msojocs-patch/server/index.js"

          if (-not (Test-Path $source_index)) {
            throw "server/index.js not found: $source_index"
          }

          $lines = Get-Content -Path $source_index
          $port_pattern = 'const port = \d+;'
          if (-not ($lines -match $port_pattern)) {
            throw "Could not find the port declaration in $source_index"
          }

          # Runtime hooks keep the app self-contained: they redirect the .be API
          # hosts (both renderer and .NET backend) and bypass the hardcoded ECDSA
          # public key whitelist of the Angular bundle. See the file for details.
          $hooks_path = "utils/inject/runtime-hooks.js"
          if (-not (Test-Path $hooks_path)) {
            throw "Runtime hooks not found: $hooks_path"
          }
          $hooks = (Get-Content -Path $hooks_path -Raw) -split "\r?\n"

          $output = New-Object System.Collections.Generic.List[string]
          $port_written = $false

          foreach ($line in $lines) {
            if (-not $port_written -and $line -match '^const port = \d+;$') {
              $output.Add("const port = $env:PATCH_SERVER_PORT;")
              $port_written = $true
              foreach ($hook_line in $hooks) { $output.Add($hook_line) }
              continue
            }
            $output.Add($line)
          }

          Set-Content -Path $source_index -Value $output -Encoding utf8NoBOM
          Write-Host "Server port set to $env:PATCH_SERVER_PORT"
          Write-Host "Injected runtime hooks from $hooks_path"

      - name: Set user credentials
        run: |
          $source_json = "FE/resources/app/out/file/identity.getfiddler.com/oauth/token.json"

          if (-not (Test-Path $source_json)) {
            throw "User credential template not found: $source_json"
          }

          $main_content = Get-Content -Path $source_json -Raw | ConvertFrom-Json

          $main_content.user_info.email = $env:PATCH_USER_EMAIL
          $main_content.user_info.firstName = $env:PATCH_USER_FNAME
          $main_content.user_info.lastName = $env:PATCH_USER_LNAME
          $main_content.user_info.country = $env:PATCH_USER_COUNTRYCODE
          $main_content.user_info.identities[0].providerName = $env:PATCH_USER_PROVIDER

          $main_content | ConvertTo-Json -Depth 5 | Set-Content -Path $source_json

      - name: Patch main.js to main.original.js
        run: |
          $source_main = "FE/resources/app/out/main.js"
          $new_main = "FE/resources/app/out/main.original.js"
          $source_index = "msojocs-patch/server/index.js"

          if (-not (Test-Path $source_main)) {
            throw "FE main.js not found: $source_main"
          }
          if (-not (Test-Path $source_index)) {
            throw "server/index.js not found: $source_index"
          }

          $main_content = Get-Content -Path $source_main -Raw
          $index_content = Get-Content -Path $source_index -Raw

          Copy-Item -Path $source_main -Destination $new_main -Force
          Set-Content -Path $source_main -Value ($index_content + $main_content)
          Write-Host "Prepended server/index.js to $source_main"

      # FE 8.x verifies that app.asar is still present. Since the archive is
      # extracted and removed above, the backend checks must be neutralised.
      - name: Patch FE 8.x WebUi checks
        run: |
          $patchingVersion = $env:SCRAPED_VERSION
          if ([string]::IsNullOrEmpty($patchingVersion) -or [version]$patchingVersion -lt [version]"8.0.0") {
            Write-Host "FE version $patchingVersion is below 8.0.0; skipping WebUi integrity patch"
            exit 0
          }

          $dll = "FE/resources/app/out/WebServer/Fiddler.WebUi.dll"
          if (-not (Test-Path $dll)) {
            throw "Fiddler.WebUi.dll not found at $dll"
          }

          python -m pip install --disable-pip-version-check --no-input dnfile
          python "utils/patch_integrity_check.py" $dll

      # The Angular bundle verifies every signed response against three hardcoded
      # ECDSA public keys, while server/index.js signs with a key generated at
      # runtime. The lookup therefore always fails and every signed endpoint
      # (e.g. /versions) is rejected with "Signature verification failed!".
      # Rewriting the whitelist result to a constant neutralises that check while
      # keeping the surrounding response parsing intact.
      - name: Patch FE 8.x frontend signature checks
        run: |
          $patchingVersion = $env:SCRAPED_VERSION
          if ([string]::IsNullOrEmpty($patchingVersion) -or [version]$patchingVersion -lt [version]"8.0.0") {
            Write-Host "FE version $patchingVersion is below 8.0.0; skipping frontend signature patch"
            exit 0
          }

          $dist = "FE/resources/app/out/WebServer/ClientApp/dist"
          if (-not (Test-Path $dist)) {
            throw "Angular bundle directory not found: $dist"
          }

          $bundles = @(Get-ChildItem -Path $dist -Filter "main-*.js" -File)
          if ($bundles.Count -eq 0) {
            throw "No main-*.js bundle found in $dist"
          }

          $pattern = 'if\(![A-Za-z_$][\w$]*\)throw new Error\("Signature verification failed!"\)'
          $replacement = 'if(!1)throw new Error("Signature verification failed!")'
          $patchedBundles = 0

          foreach ($bundle in $bundles) {
            $content = Get-Content -LiteralPath $bundle.FullName -Raw

            if ($content.Contains($replacement)) {
              Write-Host "Already patched: $($bundle.Name)"
              continue
            }

            $count = ([regex]::Matches($content, $pattern)).Count
            if ($count -eq 0) {
              if ($content.Contains('Signature verification failed!')) {
                throw "Signature check found but pattern did not match in $($bundle.Name)"
              }
              Write-Host "No frontend signature check in $($bundle.Name); nothing to patch"
              continue
            }

            $patched = [regex]::Replace($content, $pattern, $replacement)
            Set-Content -LiteralPath $bundle.FullName -Value $patched -NoNewline -Encoding utf8NoBOM
            Write-Host "Patched $count signature check(s) in $($bundle.Name)"
            $patchedBundles++
          }

          if ($patchedBundles -eq 0) {
            Write-Host "WARNING: no bundle was modified; verify the signature check manually"
          } else {
            Write-Host "Frontend signature checks patched in $patchedBundles bundle(s)"
          }

      # FE 8.x validates the ECDSA public key of every signed API response
      # against a built-in whitelist (FiddlerBackendSDK -> Enumerable.Any).
      # The local server signs responses with a runtime generated key, so the
      # whitelist check must be neutralised, otherwise the UI keeps waiting on
      # the configuration/user endpoints.
      - name: Patch FE 8.x response signature check (System.Linq.dll)
        run: |
          $patchingVersion = $env:SCRAPED_VERSION
          if ([string]::IsNullOrEmpty($patchingVersion) -or [version]$patchingVersion -lt [version]"8.0.0") {
            Write-Host "FE version $patchingVersion is below 8.0.0; skipping signature check patch"
            exit 0
          }

          $target = "FE/resources/app/out/WebServer/System.Linq.dll"
          if (-not (Test-Path $target)) {
            Write-Host "System.Linq.dll not found at $target; skipping signature check patch"
            exit 0
          }

          $url = "https://github.com/msojocs/dotnet-runtime-for-fildder/releases/download/v10.0.9-1/System.Linq.dll"
          $download = "System.Linq.dll.patched"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $download

          if ((Get-Item $download).Length -lt 100000) {
            throw "Downloaded System.Linq.dll looks truncated: $((Get-Item $download).Length) bytes"
          }

          Copy-Item -Path $download -Destination $target -Force
          Remove-Item -Path $download -Force
          Write-Host "Replaced $target with the public key whitelist patched build"

      - name: Ensure backend binary is executable (Linux)
        if: env.OS_ARCH == 'Linux (x86_64)'
        run: |
          $backend = "FE/resources/app/out/WebServer/Fiddler.WebUi"
          if (-not (Test-Path $backend)) {
            Write-Host "$backend not found; skipping"
            exit 0
          }

          try {
            $mode = [System.IO.UnixFileMode]::UserRead -bor
                    [System.IO.UnixFileMode]::UserWrite -bor
                    [System.IO.UnixFileMode]::UserExecute -bor
                    [System.IO.UnixFileMode]::GroupRead -bor
                    [System.IO.UnixFileMode]::GroupExecute -bor
                    [System.IO.UnixFileMode]::OtherRead -bor
                    [System.IO.UnixFileMode]::OtherExecute
            [System.IO.File]::SetUnixFileMode($backend, $mode)
            Write-Host "Marked $backend as executable"
          } catch {
            Write-Host "Unable to set Unix file mode: $_"
          }

      - name: Clean msojocs-patch
        run: |
          if (Test-Path msojocs-patch) {
            Remove-Item -Path "msojocs-patch" -Recurse
          } else {
            Write-Host "msojocs-patch Folder not found"
          }

      # Assert that every patch actually landed in the artifact. A silently
      # skipped step produces a package that starts but never finishes loading.
      - name: Verify patched artifact
        run: |
          $out = "FE/resources/app/out"
          $failures = New-Object System.Collections.Generic.List[string]

          function Assert-Path([string]$path, [string]$label) {
            if (Test-Path $path) { Write-Host "OK   $label" }
            else { $script:failures.Add("missing $label ($path)") }
          }

          Assert-Path "$out/main.js" "main.js"
          Assert-Path "$out/main.original.js" "main.original.js"
          Assert-Path "$out/file/identity.getfiddler.com/oauth/token.json" "mock token.json"
          Assert-Path "$out/file/api.getfiddler.com/users/sign-in.json" "mock sign-in.json"
          Assert-Path "$out/file/api.getfiddler.com/versions.json" "mock versions.json"
          Assert-Path "$out/services/lib/preload.js" "stock preload"
          Assert-Path "$out/WebServer/Fiddler.WebUi.dll" "Fiddler.WebUi.dll"
          Assert-Path "$out/WebServer/System.Linq.dll" "System.Linq.dll"

          $main = Get-Content -LiteralPath "$out/main.js" -Raw
          if ($main -match ('const port = ' + [regex]::Escape($env:PATCH_SERVER_PORT) + ';')) {
            Write-Host "OK   main.js uses port $env:PATCH_SERVER_PORT"
          } else {
            $failures.Add("main.js does not use port $env:PATCH_SERVER_PORT")
          }
          if ($main.Contains('[fe-patch]')) { Write-Host "OK   runtime hooks present" }
          else { $failures.Add("runtime hooks not found in main.js") }

          if (startsWith(env.PATCH_LANGUAGE, 'Yes')) {
            Assert-Path "$out/translate.js" "translate.js (Chinese UI)"
          }

          $patchingVersion = $env:SCRAPED_VERSION
          if (-not [string]::IsNullOrEmpty($patchingVersion) -and [version]$patchingVersion -ge [version]"8.0.0") {
            if (Test-Path "$out/WebServer/Fiddler.WebUi.dll.bak-integrity") {
              Write-Host "OK   Fiddler.WebUi.dll integrity patch applied"
            } else {
              $failures.Add("Fiddler.WebUi.dll was not patched (no .bak-integrity backup)")
            }

            $linq = Get-Item "$out/WebServer/System.Linq.dll"
            if ($linq.Length -gt 150000 -and $linq.Length -lt 230000) {
              Write-Host "OK   System.Linq.dll replaced ($($linq.Length) bytes)"
            } else {
              $failures.Add("System.Linq.dll does not look patched ($($linq.Length) bytes)")
            }

            $bundle = Get-ChildItem -Path "$out/WebServer/ClientApp/dist" -Filter "main-*.js" -File | Select-Object -First 1
            if ($bundle) {
              $content = Get-Content -LiteralPath $bundle.FullName -Raw
              if ($content.Contains('if(!1)throw new Error("Signature verification failed!")')) {
                Write-Host "OK   frontend signature check patched"
              } else {
                $failures.Add("frontend signature check not patched in $($bundle.Name)")
              }
            } else {
              $failures.Add("Angular bundle main-*.js not found")
            }
          }

          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Host "FAIL $_" }
            throw "Artifact verification failed with $($failures.Count) problem(s)"
          }
          Write-Host "All patch checks passed"

      - name: Rename FE 
        id: rename-fe
        run: |
          if (Test-Path FE) {
            $newName = "Fiddler-Everywhere-V$env:SCRAPED_VERSION-Patched"
            
            Rename-Item -Path "FE" -NewName $newName
            
            echo "patched-fe-name=$newName" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          } else {
            Write-Host "FE Folder not found!?"
          }

      - name: Upload Artifact for Patched FE
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.rename-fe.outputs.patched-fe-name }}"
          path: "${{ steps.rename-fe.outputs.patched-fe-name }}/"
          if-no-files-found: error
